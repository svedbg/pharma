name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor; 3.12 is what it runs on in practice.
        # Both are tested because a 3.12-only f-string once slipped through.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Runtime must import on a bare interpreter
        # No virtualenv exists when the systemd timer fires, so every script has
        # to import using nothing but the standard library -- and with no config
        # present, since importing a module must never require configuration.
        #
        # This used to run ast.parse, which is a syntax check wearing an import
        # check's name: `import requests` in scripts/ passed it without comment.
        # Importing for real is what the step always claimed to do, and it costs
        # nothing now that fetch.py resolves its SEC user agent lazily.
        env:
          SEC_CONTACT_EMAIL: ""
        run: |
          cd scripts
          for f in *.py; do
            python -c "import importlib; importlib.import_module('${f%.py}')" || exit 1
          done
