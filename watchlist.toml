# Watchlist for the daily biotech desk.
#
# Tiers drive position sizing, not signal logic -- every name gets the same
# veto treatment:
#   A        higher-conviction speculative; full size allowed
#   B        larger caps, more de-risked; full size allowed
#   lottery  binary micro-caps; hard 5% cap each, 15% for the whole bucket
#   legacy   carried over from the original watchlist; remove freely
#
# `thesis` is intentionally blank for names not yet researched -- the daily run
# fills these in from real sources rather than inventing them. Set entry_low and
# entry_high once you have a view; ACT-tier alerts stay disabled until you do.

[settings]
max_position_pct = 28            # tier A/B ceiling, % of allocated capital
max_position_pct_lottery = 5     # per-name ceiling for lottery tier
max_bucket_pct_lottery = 15      # total exposure across the whole lottery bucket
min_cash_reserve_pct = 15
min_runway_quarters_for_act = 3
lookback_days = 730
new_filing_window_days = 5


