# Public site settings, read by tools/build_site.py.
#
# The site lives on the custom domain desk.sved.net; svedbg.github.io/pharma
# 301-redirects to it. base_url is the one place that is spelled: the build
# writes the canonical, og:url, sitemap, robots.txt, llms.txt links and the
# CNAME file from it, so moving again is this line plus:
#   1. DNS: a CNAME record   <host>  ->  svedbg.github.io
#   2. in the repo: Settings -> Pages -> Custom domain, tick "Enforce HTTPS"
#   3. update the canonical in Google Search Console and re-run LinkedIn's Post Inspector
base_url = "https://desk.sved.net/"

[author]
# Shown in the hero byline, the footer and the JSON-LD Person. Edit freely.
name = "Svetoslav Rankov"
title = "Senior Director of Software Engineering at EDITED"
job_title = "Senior Director of Software Engineering"
organization = "EDITED"
blurb = "I lead a 20+ engineer office in Sofia. This is the side project I still build hands-on, directing an AI agent and reviewing what it writes, for my own book, and open-sourced so you can read every rule before you trust one."
url = "https://sved.net"
linkedin = ""    # paste your profile URL; the link and the schema entry appear once this is set
