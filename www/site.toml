# Public site settings, read by tools/build_site.py.
#
# To move to a custom domain (e.g. desk.sved.net):
#   1. DNS: add a CNAME record   desk  ->  svedbg.github.io
#   2. change base_url below and push; the build writes the CNAME file for Pages
#   3. in the repo: Settings -> Pages -> Custom domain -> desk.sved.net, tick "Enforce HTTPS"
#   4. update the canonical in Google Search Console and re-run LinkedIn's Post Inspector
base_url = "https://svedbg.github.io/pharma/"

